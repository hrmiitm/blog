<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="{{ `js/theme.js` | relURL }}"></script>
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta name="color-scheme" content="light dark">
  {{ if eq .Kind "404" }}<meta name="robots" content="noindex">{{ end }}
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:type" content="{{ if eq .Section `posts` }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ .Title | default site.Title }}">
  <meta property="og:description" content="{{ .Description | default site.Params.description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ site.Title }}">
  {{ if and .IsPage (eq .Section "posts") }}<meta property="article:published_time" content="{{ .Date.Format `2006-01-02T15:04:05Z07:00` }}">{{ end }}
  <link rel="icon" href="{{ `favicon.svg` | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ `css/site.css` | relURL }}">
  {{ with site.Home.OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">{{ end }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</body>
</html>
