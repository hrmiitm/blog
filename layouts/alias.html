<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page moved · {{ site.Title }}</title>
  <meta name="description" content="This note has moved to a new address.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
</head>
<body>
  <main><h1>This note has moved.</h1><p><a href="{{ .Permalink }}">Continue to the note</a> at its new address.</p></main>
</body>
</html>
