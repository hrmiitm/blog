<svg xmlns="http://www.w3.org/2000/svg" width="600" height="354" viewBox="0 0 600 354" role="img" aria-labelledby="title description">
  <title id="title">A bookmark or an archive?</title>
  <desc id="description">A bookmark keeps the address and needs the live page. An archive keeps a captured version, which can survive changes to the original.</desc>
  <rect x="1" y="1" width="598" height="352" rx="12" fill="#eeeee4" stroke="#d4d9c9"/>
  <text x="28" y="48" fill="#294735" font-family="Georgia, serif" font-size="30">What are you saving?</text>
  <g transform="translate(24 74)">
    <rect width="552" height="116" rx="8" fill="#faf9f2" stroke="#d4d9c9"/>
    <g transform="translate(24 28)" fill="none" stroke="#697661" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="50" height="60" rx="5"/>
      <path d="M16 0v31l9-6 9 6V0"/>
      <path d="M13 44h25m-25 7h18" opacity=".55"/>
    </g>
    <text x="98" y="43" fill="#333e32" font-family="system-ui, sans-serif" font-size="26" font-weight="600">Bookmark</text>
    <text x="98" y="79" fill="#5a6753" font-family="system-ui, sans-serif" font-size="24">The address. Needs the live page.</text>
  </g>
  <g transform="translate(24 206)">
    <rect width="552" height="124" rx="8" fill="#dce8d6" stroke="#b9cbb1"/>
    <g transform="translate(24 31)" fill="none" stroke="#315f4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 0h38a5 5 0 0 1 5 5v49" opacity=".5"/>
      <rect x="0" y="8" width="47" height="54" rx="5"/>
      <path d="M0 23h47m-34 12h21m-21 8h21m-21 8h13"/>
      <path d="m35 54 5 5 10-12" stroke-width="3"/>
    </g>
    <text x="98" y="43" fill="#294735" font-family="system-ui, sans-serif" font-size="26" font-weight="600">Archive</text>
    <text x="98" y="79" fill="#31543d" font-family="system-ui, sans-serif" font-size="24">A captured version of the page.</text>
    <text x="98" y="108" fill="#31543d" font-family="system-ui, sans-serif" font-size="20">Only the parts successfully saved.</text>
  </g>
</svg>
